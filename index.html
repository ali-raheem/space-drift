<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Space Drift</title>
  <meta name="description" content="An endless, procedurally generated journey through space. Works offline; makes a good screensaver.">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Icon sprite: 24×24 line icons drawn in currentColor; use as <svg class="icon"><use href="#i-name"/></svg>. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5.5" width="3.5" height="13" rx="1" fill="currentColor"/><rect x="14" y="5.5" width="3.5" height="13" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5.5 6v12l9-6z" fill="currentColor"/><path d="M18.5 6v12"/></symbol>
    <symbol id="i-warp" viewBox="0 0 24 24"><path d="M12 12L4 6M12 12l8-6M12 12L4 18M12 12l8 6M12 12H3M12 12h9"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h8M16 18h4"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="14" cy="18" r="2"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
    <symbol id="i-hide" viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 4l16 16"/></symbol>
    <symbol id="i-install" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19.5h14"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-captions" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M7 10.5h6M7 14h10"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3.5 9.5H7L11.5 5.5v13L7 14.5H3.5z"/><path d="M15 9a4 4 0 0 1 0 6"/><path d="M17.5 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-sound-off" viewBox="0 0 24 24"><path d="M3.5 9.5H7L11.5 5.5v13L7 14.5H3.5z"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></symbol>
  </svg>

  <canvas id="view" aria-label="An endless journey through space"></canvas>

  <div id="hud">
    <div id="caption" aria-live="polite">
      <div class="kicker"></div>
      <div class="title"></div>
      <div class="sub"></div>
    </div>

    <aside id="settings" class="panel" hidden aria-label="Settings">
      <h2>Space Drift</h2>
      <button class="row" id="set-install" hidden><svg class="icon"><use href="#i-install"/></svg><span>Install app<small></small></span></button>
      <button class="row" id="set-sound" role="switch"><svg class="icon"><use href="#i-sound"/></svg><span>Ambient soundtrack<small id="sound-hint"></small></span><i class="switch"></i></button>
      <label class="row volume" id="set-volume"><span class="icon-gap"></span><span>Volume</span><input type="range" id="volume" min="0" max="1" step="0.05" aria-label="Volume"></label>
      <button class="row" id="set-captions" role="switch"><svg class="icon"><use href="#i-captions"/></svg><span>Captions<small>names of what you pass</small></span><i class="switch"></i></button>
      <button class="row" id="set-awake" role="switch"><svg class="icon"><use href="#i-sun"/></svg><span>Keep screen awake<small>while this tab is visible</small></span><i class="switch"></i></button>
      <button class="row" id="set-full" role="switch"><svg class="icon"><use href="#i-fullscreen"/></svg><span>Fullscreen<small>double-click the view, or press F</small></span><i class="switch"></i></button>
      <button class="row" id="set-hide"><svg class="icon"><use href="#i-hide"/></svg><span>Hide interface<small>tap the screen or press H to bring it back</small></span></button>
      <button class="row" id="set-new"><svg class="icon"><use href="#i-dice"/></svg><span>New journey<small>start again from a fresh random seed</small></span></button>
      <button class="row" id="set-link"><svg class="icon"><use href="#i-link"/></svg><span>Copy link to this journey<small id="seed"></small></span></button>
      <dl class="keys">
        <dt>Space</dt><dd>pause</dd><dt>+ −</dt><dd>speed</dd>
        <dt>W</dt><dd>warp now</dd><dt>N</dt><dd>next encounter</dd>
        <dt>C</dt><dd>captions</dd><dt>M</dt><dd>sound</dd>
        <dt>F</dt><dd>fullscreen</dd><dt>H</dt><dd>hide interface</dd>
        <dt>S</dt><dd>settings</dd>
      </dl>
      <p class="version" id="version"></p>
    </aside>

    <nav id="controls" aria-label="Controls">
      <button id="btn-pause" title="Pause (Space)" aria-label="Pause"><svg class="icon"><use href="#i-pause"/></svg></button>
      <button id="btn-speed" title="Cruising speed (+/−)" aria-label="Cruising speed">1×</button>
      <button id="btn-warp" title="Warp now (W)" aria-label="Warp now"><svg class="icon"><use href="#i-warp"/></svg></button>
      <button id="btn-next" title="Next encounter (N)" aria-label="Next encounter"><svg class="icon"><use href="#i-next"/></svg></button>
      <button id="btn-full" title="Fullscreen (F)" aria-label="Fullscreen"><svg class="icon"><use href="#i-fullscreen"/></svg></button>
      <button id="btn-settings" title="Settings (S)" aria-label="Settings"><svg class="icon"><use href="#i-settings"/></svg></button>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
